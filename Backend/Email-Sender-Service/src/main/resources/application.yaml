spring:
  application:
    name: Email-Sender-Service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 13MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME:}}
    max-recipients: 500
    max-csv-bytes: 2097152
    max-attachment-bytes: 10485760
